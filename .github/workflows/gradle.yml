name: Build Only (No Upload to Nexus)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get short Git hash
        id: get-git-hash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "GIT_HASH=$GIT_HASH" >> $GITHUB_ENV

      - name: Build project
        run: ./gradlew build

      - name: Find JAR file
        id: find-jar
        run: |
          JAR_FILES=(build/libs/*.jar)
          BASE_JAR_FILES=()
          for file in "${JAR_FILES[@]}"; do
            if [[ ! "$file" == *"-dev.jar" && ! "$file" == *"-sources.jar" ]]; then
              BASE_JAR_FILES+=("$file")
            fi
          done
          if [ ${#BASE_JAR_FILES[@]} -ne 1 ]; then
            echo "Error: Expected exactly one base version JAR file, found ${#BASE_JAR_FILES[@]}"
            exit 1
          fi
          JAR_FILE="${BASE_JAR_FILES[0]}"
          
          # Strip "-shaded" from the filename if present
          CLEAN_JAR_NAME=$(basename "$JAR_FILE" | sed 's/-shaded//')
          CLEAN_JAR_PATH="build/libs/$CLEAN_JAR_NAME"
          cp "$JAR_FILE" "$CLEAN_JAR_PATH"
          
          echo "JAR_FILE=$CLEAN_JAR_PATH" >> $GITHUB_ENV
          echo "JAR_NAME=$CLEAN_JAR_NAME" >> $GITHUB_ENV

      - name: Display JAR info (optional)
        run: |
          echo "✅ Build completed successfully."
          echo "📦 JAR file: ${{ env.JAR_FILE }}"
          echo "🏷️  Git hash: ${{ env.GIT_HASH }}"
          echo "⏩ No upload to Nexus performed."
